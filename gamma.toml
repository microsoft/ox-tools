all-features = true
profile = "mutants"
cargo-args = ["--locked"]

exclude-files = [
    # Repository automation invokes external tools rather than implementing product behavior.
    "crates/automation/**",
    # Integration-test fixtures are deliberately compiled through the `internals` feature.
    "crates/cargo-gamma-lib/src/testing.rs",
    "crates/cargo-gamma-lib/src/commands/run/recovery_test_util.rs",
    "crates/cargo-gamma-lib/src/commands/suppress/native_test_util.rs",
    "crates/cargo-gamma-lib/src/commands/verdict_log/native_test_util.rs",
    "crates/cargo-gamma-lib/src/discover/survey/native_test_util.rs",
    "crates/cargo-gamma-lib/src/exec/build/native_test_util.rs",
    "crates/cargo-gamma-lib/src/exec/native_storage_test_util.rs",
    "crates/cargo-gamma-lib/src/exec/sync/native_test_util.rs",
    "crates/cargo-gamma-lib/src/exec/testing_state/native_test_util.rs",
    "crates/cargo-gamma-lib/src/exec/workspace/native_test_util.rs",
    "crates/cargo-gamma-lib/src/exec/sweep/native_smoke.rs",
    # Immutable compiler and collector inputs are test data, not production modules.
    "crates/cargo-gamma-engine/src/ops/collect/collector/fixtures/**",
    "crates/cargo-gamma-engine/src/ops/collect/collector/resource/fixtures/**",
    "crates/cargo-gamma-engine/src/ops/collect/collector/resource/acceptance/guarded.rs",
    "crates/cargo-gamma-engine/src/ops/collect/collector/resource/effects/fixture.rs",
    "crates/cargo-gamma-lib/src/exec/build/fixtures/**",
    # Process fault injection exists only to force test-only operating-system failure paths.
    "crates/cargo-gamma-process/src/faults.rs",
]

# Human-readable debug and redacted output is diagnostic text, not a supported behavioral contract.
exclude-trait-impls = ["Debug"]

[resources]
# Two concurrent Cargo subprocesses preserve useful parallelism without recreating the target-dir
# lock contention that this shared admission resource is intended to prevent.
cargo-aprz-cargo-subprocess = 2
