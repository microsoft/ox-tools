version: 2
updates:
- package-ecosystem: "cargo"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "monday"
    time: "07:00"
    timezone: "UTC"
  commit-message:
    prefix: "chore: "
  groups:
    # Keep interdependent crates from microsoft/oxidizer in a single PR.
    oxidizer:
      patterns:
        - "allocation_hints"
        - "anyspawn*"
        - "arty*"
        - "bytesbuf*"
        - "cachet*"
        - "compressors"
        - "data_privacy*"
        - "fakeable*"
        - "fetch*"
        - "fundle*"
        - "future_assert"
        - "http_compression"
        - "http_extensions"
        - "http_headers*"
        - "http_path_template"
        - "internity*"
        - "layered"
        - "metabench*"
        - "msvc_spectre_libs*"
        - "multitude*"
        - "observed*"
        - "ohno*"
        - "performables"
        - "plurality"
        - "rallocator"
        - "recoverable"
        - "rest_over_grpc*"
        - "routerama*"
        - "seatbelt*"
        - "seismograph*"
        - "templated_uri*"
        - "thread_aware*"
        - "tick"
        - "uniflight"
  ignore:
    # ignore minor updates for tokio as they are semver compatible
    - dependency-name: "tokio"
      versions: ["1.x"]
    # ignore patch updates for all dependencies
    - dependency-name: "*"
      update-types: ["version-update:semver-patch"]

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "monthly"
  commit-message:
    prefix: "chore: "
  # Wait 7 days after a release before proposing it, so the community has a
  # window to detect and report a compromised action release.
  cooldown:
    default-days: 7
