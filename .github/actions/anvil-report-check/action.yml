          const failedRecipe = process.env.ANVIL_FAILED_RECIPE;
          const runner = `${process.env.RUNNER_OS}-${process.env.RUNNER_ARCH}`.toLowerCase();
          const externalId = `cargo-anvil:${group}:${runner}`;
