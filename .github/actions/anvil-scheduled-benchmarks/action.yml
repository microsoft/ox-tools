# Fragment spliced into the scheduled-benchmarks group's composite action.
# Not a standalone action: this is part of a steps list.
    - name: Restore benchmark history
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # Per-leg identity comes from the workflow: only it knows the matrix
        # value. Deriving the name from the runner OS instead would collide
        # if two legs ever ran on like-OS runners, merging two machines'
        # samples into one series.
