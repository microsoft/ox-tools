# the concrete check-group name (pr-fast, pr-test, scheduled-runtime-analysis, ...).
name: anvil-scheduled-benchmarks
description: Run the scheduled-benchmarks check group.
inputs:
  include_modified:
    description: |
      Pre-formatted --package args (e.g. "--package alpha@1.0.0 --package
      beta@0.2.0") for the modified tier, or the sentinel "--skip" when
      nothing modified. Packages are version-qualified cargo specs so they
      resolve uniquely even when a like-named crate is also a transitive
      dependency. Local invocations leave it unset; recipes default to
      --workspace.
    default: ""
    required: false
  include_affected:
    description: |
      Same shape as include_modified, but for the affected tier
      (modified ∪ rev-deps).
    default: ""
    required: false
  include_required:
    description: |
      Same shape as include_modified, but for the required tier
      (affected ∪ workspace-internal transitive deps).
    default: ""
    required: false
  free-disk-space:
    description: Remove unused toolchains from GitHub-hosted runners before setup.
    default: "false"
    required: false
runs:
  using: composite
  steps:
    - name: Restore benchmark history
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # Per-leg: the history is partitioned by machine, and one run cannot
        # upload the same artifact name twice.
        ARTIFACT: bench-history-${{ runner.os }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The caller's workflow *name*, not a hardcoded filename: the root
        # scheduled workflow is an owned, renameable file, and a rename must
        # not silently reset the series.
        WORKFLOW: ${{ github.workflow }}
        REPO: ${{ github.repository }}
        WINDOW: "30"
      run: |
        set -euo pipefail
        mkdir -p target/anvil/bench-history

        # Walk back from the newest run and take the first that carries this
        # leg's artifact. Restoring from the latest *successful* run would
        # drop every sample collected while the pipeline was red from a
        # regression — precisely the window that matters.
        #
        # Absence and failure are kept distinct. A run is only a candidate
        # once the artifacts API confirms the artifact exists and has not
        # expired; a download that then fails is an operational error
        # (token, API, corrupt payload) and fails the job rather than being
        # silently downgraded to a cold start. That distinction is what
        # stops one transient failure from publishing an empty store over a
        # good history.
        for run_id in $(gh run list --workflow "$WORKFLOW" \
            --branch "$DEFAULT_BRANCH" --limit "$WINDOW" \
            --json databaseId --jq '.[].databaseId'); do
          artifact_id=$(gh api --paginate \
            "repos/$REPO/actions/runs/$run_id/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT\" and .expired == false) | .id" \
            | head -n1)
          [ -n "$artifact_id" ] || continue

          if ! gh run download "$run_id" --name "$ARTIFACT" --dir target/anvil/bench-history; then
            echo "::error::found $ARTIFACT in run $run_id but could not download it;" \
                 "failing rather than continuing with an empty history, which would" \
                 "publish a truncated store over the existing chain."
            exit 1
          fi
          echo "restored benchmark history from run $run_id"
          echo "ANVIL_BENCH_RESTORE=restored" >> "$GITHUB_ENV"
          exit 0
        done

        # No run in the window carried the artifact. That is a genuine cold
        # start (first run, or the chain lapsed), so it is surfaced on the
        # summary rather than only in this log — "history quietly restarted"
        # must not look like "no regressions".
        echo "ANVIL_BENCH_RESTORE=cold-start" >> "$GITHUB_ENV"
        echo "no $ARTIFACT artifact in the last $WINDOW scheduled runs; starting a new history"
        {
          printf '### Benchmark history: cold start\n\n'
          printf 'No `%s` artifact was found in the last %s `%s` runs on `%s`, ' \
            "$ARTIFACT" "$WINDOW" "$WORKFLOW" "$DEFAULT_BRANCH"
          printf 'so this run starts a new series. Trend detection needs several runs of history.\n'
        } >> "$GITHUB_STEP_SUMMARY"
    - uses: ./.github/actions/anvil-setup
      with:
        group: scheduled-benchmarks
        free-disk-space: ${{ inputs.free-disk-space }}
    - name: Run just anvil-scheduled-benchmarks
      shell: bash
      env:
        ANVIL_INCLUDE_MODIFIED: ${{ inputs.include_modified }}
        ANVIL_INCLUDE_AFFECTED: ${{ inputs.include_affected }}
        ANVIL_INCLUDE_REQUIRED: ${{ inputs.include_required }}
        # Some checks (e.g. cargo-aprz, run only by groups that include it)
        # hit the GitHub API; pass the built-in token so they use the
        # authenticated quota (1000 vs 60 req/hr). Harmless for groups whose
        # checks never read it.
        GITHUB_TOKEN: ${{ github.token }}
      run: just anvil-scheduled-benchmarks
    - name: Save benchmark history
      # always(): the run's own samples belong in the history even when the
      # analysis flagged a regression and failed the job.
      #
      # Guarded on the restore having reached a known state: if the restore
      # failed operationally the store is not a continuation of the chain,
      # and publishing it would overwrite good history with a truncated
      # snapshot.
      if: always() && env.ANVIL_BENCH_RESTORE != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bench-history-${{ runner.os }}
        path: target/anvil/bench-history
        # Comfortably longer than the scheduled cadence, so a paused or
        # infrequent schedule does not break the chain.
        retention-days: 90
        if-no-files-found: ignore
    - name: Publish benchmark findings
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [ -f target/anvil/bench/findings.md ]; then
          cat target/anvil/bench/findings.md >> "$GITHUB_STEP_SUMMARY"
        fi
