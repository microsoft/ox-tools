name: anvil-scheduled-impl

on:
  workflow_call:
    inputs:
      linux_runner:
        description: Runner label for x86_64 Linux jobs.
        type: string
        default: ubuntu-latest
      windows_runner:
        description: Runner label for x86_64 Windows jobs.
        type: string
        default: windows-latest
      linux_arm_runner:
        description: Runner label for aarch64 Linux jobs.
        type: string
        default: ubuntu-24.04-arm
      windows_arm_runner:
        description: Runner label for aarch64 Windows jobs.
        type: string
        default: windows-11-arm
    secrets:
      CODECOV_TOKEN:
        description: |
          Codecov upload token. Optional for public repos that have OIDC
          configured at Codecov; required for private repos.
        required: false

# Note on matrices: see pr-impl-workflow.yml for the rationale. OS
# matrices are hardcoded; per-leg runner labels are inputs.

jobs:
  scheduled-test:
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-scheduled-test
        with:
          free-disk-space: true
      - name: Upload coverage to Codecov
        # Upload from every leg except windows-11-arm (see the matching
        # comment in pr-impl-workflow.yml for the rationale).
        # Multi-flag tag combines the OS with a "scheduled" marker so
        # the Codecov UI can distinguish PR-tier uploads from scheduled
        # uploads while still tracking each platform separately.
        if: matrix.os != 'windows-arm'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/coverage/lcov-all-features.info,target/coverage/lcov-no-default.info
          flags: scheduled,${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  scheduled-advisories:
    # Cross-OS / cross-arch because clippy and udeps in this group
    # compile per host, so cfg-gated code must be linted/scanned on
    # every leg.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-scheduled-advisories

  scheduled-runtime-analysis:
    # Full-workspace counterpart of pr-runtime-analysis. OS matrix
    # mirrors pr-runtime-analysis so any OS already considered "worth
    # running miri on" gets the stricter profiles (tree-borrows,
    # strict-provenance, race-coverage) too. One job per OS leg runs
    # `just anvil-scheduled-runtime-analysis`, which executes all four
    # miri profiles (base miri + the three stricter ones) sequentially
    # within the leg. Parallelism is across OS legs, not across profiles:
    # running the profiles sequentially lets them share toolchain setup
    # and the target/ cache, which is the right trade given each profile
    # already costs hours.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-scheduled-runtime-analysis

  scheduled-exhaustive:
    # x86_64-only by design: this group includes mutants-full (which
    # doesn't build on aarch64-pc-windows-msvc — winapi crate
    # incompatibility) plus cargo-hack feature powerset and bench.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner || inputs.windows_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-scheduled-exhaustive

  scheduled-benchmarks:
    # Benchmark regression detection. x86_64-only, matching
    # scheduled-exhaustive. The history is partitioned per machine, so
    # each leg carries its own artifact rather than sharing one name.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner || inputs.windows_runner }}
    permissions:
      contents: read
      # Restoring the history reads the Actions runs/artifacts API.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The analysis orders each series by first-parent commit
          # topology and locates the merge-base, so it needs the whole
          # commit graph.
          fetch-depth: 0
      - name: Restore benchmark history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: bench-history-${{ matrix.os }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p target/anvil/bench-history
          # Walk back from the newest run and take the first one that
          # carries the artifact. Restoring from the latest *successful*
          # run would drop every sample collected while the pipeline was
          # red from a regression — precisely the window that matters.
          # The in-progress run of this very workflow has not uploaded
          # yet, so it simply fails the download and the loop moves on.
          for run_id in $(gh run list --workflow anvil-scheduled.yml \
              --branch "$DEFAULT_BRANCH" --limit 10 \
              --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run_id" --name "$ARTIFACT" \
                --dir target/anvil/bench-history 2>/dev/null; then
              echo "restored benchmark history from run $run_id"
              exit 0
            fi
          done
          echo "no $ARTIFACT artifact in the recent scheduled runs; starting with an empty history"
      - uses: ./.github/actions/anvil-scheduled-benchmarks
      - name: Save benchmark history
        # always(): the run's own samples belong in the history even
        # when the analysis flagged a regression and failed the job.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-history-${{ matrix.os }}
          path: target/anvil/bench-history
          # Comfortably longer than the scheduled cadence, so a paused
          # or infrequent schedule does not break the chain.
          retention-days: 90
          if-no-files-found: ignore
      - name: Publish benchmark findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f target/anvil/bench/findings.md ]; then
            cat target/anvil/bench/findings.md >> "$GITHUB_STEP_SUMMARY"
          fi
