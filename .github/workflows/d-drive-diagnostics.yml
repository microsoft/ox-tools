name: D drive space investigation

on:
  push:
    branches: [u/makolnek/build-disk-usage]
    paths: [.github/workflows/d-drive-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bd3afbbdcdd7a7b0bab0cd3d98220216156470e0
      - name: Record initial disk space
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: |
          git rev-parse HEAD
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
      - uses: ./.anvil/github/actions/run-group
        with:
          group: pr-test
          free-disk-space: true
          impact_mode: "off"
      - name: Inspect D drive after coverage
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh -NoProfile -Command ". '{0}'"
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
          Write-Host 'D root entries, including hidden files:'
          Get-ChildItem -LiteralPath 'D:\' -Force |
            Select-Object Mode, Length, FullName | Format-Table -AutoSize
          Write-Host 'Environment paths:'
          Get-ChildItem Env: |
            Where-Object Name -Match '^(CARGO_HOME|CARGO_TARGET_DIR|RUSTUP_HOME|RUNNER_TEMP|RUNNER_TOOL_CACHE|TEMP|TMP|GITHUB_WORKSPACE)$' |
            Sort-Object Name | Format-Table -AutoSize

          $sizes = @{}
          $largest = [System.Collections.Generic.List[object]]::new()
          $scanErrors = @()
          $count = 0L
          $bytes = 0L
          Get-ChildItem -LiteralPath 'D:\' -Recurse -File -Force -ErrorAction SilentlyContinue -ErrorVariable +scanErrors |
            ForEach-Object {
              if ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) { return }
              $count++
              $bytes += $_.Length
              $parts = $_.FullName.Substring(3).Split('\')
              $path = 'D:'
              for ($depth = 0; $depth -lt [Math]::Min(10, $parts.Length - 1); $depth++) {
                $path += '\' + $parts[$depth]
                if (-not $sizes.ContainsKey($path)) { $sizes[$path] = 0L }
                $sizes[$path] += $_.Length
              }
              $largest.Add([pscustomobject]@{ Bytes = $_.Length; Path = $_.FullName })
              if ($largest.Count -ge 256) {
                $top = @($largest | Sort-Object Bytes -Descending | Select-Object -First 25)
                $largest.Clear()
                $largest.AddRange([object[]]$top)
              }
            }
          Write-Host "Scanned $count files, $([Math]::Round($bytes / 1GB, 2)) GiB logical size."
          Write-Host 'Largest directories (nested totals overlap; logical size, not allocated space):'
          $sizes.GetEnumerator() | Sort-Object Value -Descending | Select-Object -First 80 |
            ForEach-Object { [pscustomobject]@{ GiB = [Math]::Round($_.Value / 1GB, 3); Path = $_.Key } } |
            Format-Table -AutoSize -Wrap
          Write-Host 'Largest files:'
          $largest | Sort-Object Bytes -Descending | Select-Object -First 25 |
            Select-Object @{ Name = 'GiB'; Expression = { [Math]::Round($_.Bytes / 1GB, 3) } }, Path |
            Format-Table -AutoSize -Wrap
          if ($scanErrors.Count -gt 0) {
            Write-Warning "Directory scan was incomplete: $($scanErrors.Count) errors."
            $scanErrors | Select-Object -First 10 | ForEach-Object { Write-Warning $_.ToString() }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
