name: Coverage gate run smoke

on:
  pull_request:
    paths:
      - ".github/workflows/coverage-gate-run-smoke.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/cargo-coverage-gate/**"
      - "justfiles/anvil/checks/llvm-cov.just"
      - "justfiles/anvil/tools.just"
      - "justfiles/anvil/versions.just"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-collection:
    name: Pinned nightly real collection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/anvil-setup
        with:
          group: none
      - name: Install existing Anvil coverage prerequisites
        shell: pwsh
        run: |
          just anvil-component-nightly-llvm-tools-install
          just anvil-tool-cargo-llvm-cov-install
          just anvil-tool-cargo-nextest-install
      - name: Collect and gate real coverage
        shell: pwsh
        run: >-
          cargo +nightly-2026-05-30 test --locked
          --package cargo-coverage-gate --test cli
          real_collection_smoke_produces_lcov_and_a_passing_verdict
          -- --ignored --exact
