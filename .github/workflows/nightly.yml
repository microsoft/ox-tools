name: nightly

permissions:
  contents: read
  pull-requests: read

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  nightly-gatekeeper:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Check for changes in last 24 hours
        run: |
          # Check logs for commits in the last 24 hours on the current branch
          if [[ -z $(git log --since="24 hours ago" --pretty=format:"%H") ]]; then
            echo "No commits in the last 24 hours. Skipping..."
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found. Proceeding..."
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

  mutation-testing:
    needs: [nightly-gatekeeper]
    if: ${{ needs.nightly-gatekeeper.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          enable-wild-linker: true
          rust-toolchain: RUST_NIGHTLY
          cargo-tools: CARGO_MUTANTS_VERSION

      # execute
      - name: Mutate All
        run: cargo +${{ env.RUST_NIGHTLY }} -Zscript scripts/mutants.rs

      - name: Create or Update Issue on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="[Anvil] Scheduled checks failed"
          MARKER="<!-- anvil scheduled failure -->"
          ISSUE_BODY="$MARKER

          The legacy nightly mutation-testing workflow failed.

          [View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          # Share Anvil's marker-owned incident so overlapping mutation
          # failures produce one durable issue and one notification stream.
          EXISTING_ISSUE=$(gh issue list \
            --state open \
            --search '"anvil scheduled failure" in:body' \
            --limit 100 \
            --json number,body \
            --jq '.[] | select(.body | contains("<!-- anvil scheduled failure -->")) | .number' \
            | head -n 1)
          if [[ -n "$EXISTING_ISSUE" ]]; then
            gh issue comment "$EXISTING_ISSUE" --body "$ISSUE_BODY"
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$ISSUE_BODY"
          fi
