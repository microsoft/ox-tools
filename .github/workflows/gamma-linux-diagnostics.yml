name: Diagnose protected Linux mutation run

on:
  workflow_dispatch:
  push:
    branches: [makolnek-microsoft-scheduled-build-timings]
    paths:
      - .github/workflows/gamma-linux-diagnostics.yml
      - scripts/gamma-linux-diagnostics.py

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/anvil-setup
        with:
          group: scheduled-exhaustive
      - name: Build temporary diagnostic coordinator
        shell: bash
        run: |
          cargo build --locked --release -p cargo-gamma --bin cargo-gamma
          mkdir -p "$RUNNER_TEMP/gamma-diagnostic-bin" "$RUNNER_TEMP/gamma-diagnostic"
          cp target/release/cargo-gamma "$RUNNER_TEMP/gamma-diagnostic-bin/"
          echo "$RUNNER_TEMP/gamma-diagnostic-bin" >> "$GITHUB_PATH"
      - name: Prepare isolated campaign identity and external limits
        shell: bash
        run: |
          sudo useradd --create-home --shell /bin/bash gamma-diagnostic
          uid=$(id -u gamma-diagnostic)
          echo "DIAGNOSTIC_UID=$uid" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_BOUNDARY=user-$uid.slice" >> "$GITHUB_ENV"
          home=/home/gamma-diagnostic
          sudo mkdir -p "$home/.cargo" "$home/tmp"
          for name in bin registry .crates.toml .crates2.json; do
            if test -e "$HOME/.cargo/$name"; then
              sudo cp -a "$HOME/.cargo/$name" "$home/.cargo/"
            fi
          done
          sudo cp -a "$HOME/.rustup" "$home/"
          sudo chown -R gamma-diagnostic:gamma-diagnostic \
            "$home" "$GITHUB_WORKSPACE"
          sudo chown "$USER:gamma-diagnostic" "$RUNNER_TEMP/gamma-diagnostic"
          sudo chmod 2775 "$RUNNER_TEMP/gamma-diagnostic"
          sudo loginctl enable-linger gamma-diagnostic
          sudo systemctl start "user@$uid.service"
          sudo systemctl set-property --runtime "user-$uid.slice" \
            MemoryAccounting=yes MemoryMax=10G MemorySwapMax=0 TasksMax=1024
          group=$(sudo systemctl show "user-$uid.slice" --property=ControlGroup --value)
          test "$group" = "/user.slice/user-$uid.slice"
          echo 1 | sudo tee "/sys/fs/cgroup$group/memory.oom.group"
          sudo systemctl show "user-$uid.slice" \
            --property=ControlGroup,MemoryMax,MemorySwapMax,TasksMax \
            | tee "$RUNNER_TEMP/gamma-diagnostic/systemd-boundary.txt"
      - name: Start independent diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sudo --preserve-env=GH_TOKEN,GITHUB_API_URL,GITHUB_REPOSITORY,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SERVER_URL,GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            python3 -u scripts/gamma-linux-diagnostics.py observe \
            "$RUNNER_TEMP/gamma-diagnostic" "$DIAGNOSTIC_BOUNDARY" \
            > "$RUNNER_TEMP/gamma-diagnostic/observer.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/gamma-diagnostic/observer.pid"
          for attempt in {1..30}; do
            if test -f "$RUNNER_TEMP/gamma-diagnostic/ready"; then
              cat "$RUNNER_TEMP/gamma-diagnostic/ready"
              exit 0
            fi
            if ! sudo kill -0 "$(cat "$RUNNER_TEMP/gamma-diagnostic/observer.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/gamma-diagnostic/observer.log"
              exit 1
            fi
            sleep 2
          done
          echo "::error::Diagnostics did not become ready; refusing an unobserved run."
          exit 1
      - name: Run unchanged exhaustive group inside external user limits
        id: campaign
        shell: bash
        run: |
          set +e
          sudo -u gamma-diagnostic env -i \
            HOME=/home/gamma-diagnostic USER=gamma-diagnostic LOGNAME=gamma-diagnostic \
            PATH="$RUNNER_TEMP/gamma-diagnostic-bin:/home/gamma-diagnostic/.cargo/bin:/usr/local/bin:/usr/bin:/bin" \
            RUSTUP_HOME=/home/gamma-diagnostic/.rustup CARGO_HOME=/home/gamma-diagnostic/.cargo \
            TMPDIR=/home/gamma-diagnostic/tmp RUNNER_TEMP=/home/gamma-diagnostic/tmp \
            XDG_RUNTIME_DIR="/run/user/$DIAGNOSTIC_UID" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$DIAGNOSTIC_UID/bus" \
            CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted ANVIL_IMPACT=off \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GAMMA_DIAGNOSTIC_BOUNDARY="$DIAGNOSTIC_BOUNDARY" \
            GAMMA_DIAGNOSTIC_LAUNCH_LOG="$RUNNER_TEMP/gamma-diagnostic/launches.jsonl" \
            systemd-run --user --scope --quiet --collect --same-dir \
              --unit="gamma-diagnostic-$GITHUB_RUN_ID.scope" \
              --property=Delegate=yes --property=MemoryAccounting=yes \
              --property=RuntimeMaxSec=18000 \
              python3 scripts/gamma-linux-diagnostics.py run \
              "$RUNNER_TEMP/gamma-diagnostic" \
            2>&1 | tee "$RUNNER_TEMP/gamma-diagnostic/group.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > "$RUNNER_TEMP/gamma-diagnostic/campaign-exit"
          if test -f "$RUNNER_TEMP/gamma-diagnostic/controlled-stop.json"; then
            echo "::error::External safety threshold reached; this is not a successful exhaustive check."
            exit 1
          fi
          exit "$status"
      - name: Finish diagnostics
        if: always()
        env:
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gamma-diagnostic"
          if test -n "${DIAGNOSTIC_BOUNDARY:-}"; then
            sudo systemctl stop "$DIAGNOSTIC_BOUNDARY"
          fi
          echo "$CAMPAIGN_OUTCOME" > "$RUNNER_TEMP/gamma-diagnostic/done"
          if ! test -f "$RUNNER_TEMP/gamma-diagnostic/observer.pid"; then exit 0; fi
          for attempt in {1..40}; do
            if test -f "$RUNNER_TEMP/gamma-diagnostic/finished"; then
              cat "$RUNNER_TEMP/gamma-diagnostic/observer.log"
              exit 0
            fi
            if ! sudo kill -0 "$(cat "$RUNNER_TEMP/gamma-diagnostic/observer.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/gamma-diagnostic/observer.log"
              echo "::error::Independent diagnostic observer exited unexpectedly."
              exit 1
            fi
            sleep 2
          done
          echo "::error::Independent diagnostics did not finish."
          exit 1
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gamma-protected-linux-diagnostics
          path: |
            ${{ runner.temp }}/gamma-diagnostic/
            target/cargo-gamma/gamma-report.*
            target/cargo-gamma/gamma-diagnostics.json
            target/cargo-gamma/gamma-perf-advice.md
          if-no-files-found: error
          retention-days: 30
