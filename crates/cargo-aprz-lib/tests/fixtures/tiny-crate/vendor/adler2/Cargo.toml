# Stand-in for the crates.io crate of the same name. It is a path dependency so
# `cargo metadata` never reaches the network; the facts reported for it come from
# the synthetic database dump in `tests/support/dump.rs`.

[package]
name = "adler2"
version = "2.0.1"
edition = "2024"
