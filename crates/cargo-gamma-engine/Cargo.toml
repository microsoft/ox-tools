[package]
name = "cargo-gamma-engine"
description = "Internal Rust source mutation engine for cargo-gamma"
version = "0.3.0"
readme = "README.md"
keywords = ["cargo", "mutation-testing", "testing"]
categories = ["development-tools::testing"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/microsoft/ox-tools/tree/main/crates/cargo-gamma-engine"

[package.metadata.docs.rs]
all-features = true

[package.metadata.ox-gen-readme]
# This is an implementation detail of `cargo-gamma`; its README is an explicit stability warning.
disable = true

# This dependency constrains blake3's transitive version without being used directly.
[package.metadata.cargo-udeps.ignore]
normal = ["constant_time_eq"]

[package.metadata.unused-deps]
allowed = ["constant_time_eq"]

[package.metadata.coverage-gate]
# Ratchet this from the lowest production-only line result across supported CI platforms; retain
# the existing precision rather than rounding upward and creating a platform-sensitive failure.
min-lines-percent = 99.39603

[dependencies]
blake3 = { workspace = true, features = ["std"] }
camino = { workspace = true }
compact_str = { workspace = true, features = ["serde", "std"] }
constant_time_eq = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations", "proc-macro"] }
quote = { workspace = true }
regex-syntax = { workspace = true, features = ["std", "unicode"] }
rustc-hash = { workspace = true, features = ["std"] }
rustc_lexer = { workspace = true }
serde = { workspace = true, features = ["derive", "rc", "std"] }
strsim = { workspace = true }
syn = { workspace = true, features = ["full", "parsing", "printing", "visit", "extra-traits", "clone-impls", "proc-macro"] }

[dev-dependencies]
bolero = { workspace = true }
bolero-engine = { workspace = true, features = ["any"] }
tempfile = { workspace = true }
walkdir = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
