[package]
name = "cargo-ensure-no-cyclic-deps"
description = "A cargo subcommand to detect cyclic dependencies in workspace crates"
version = "0.2.0"
readme = "README.md"
keywords = ["oxidizer", "cargo", "subcommand", "dependencies", "cycles"]
categories = ["development-tools::cargo-plugins"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/microsoft/ox-tools/tree/main/crates/cargo-ensure-no-cyclic-deps"

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo_check_external_types]
# `ohno::AppError` is the error type of the public `run` entry point.
allowed_external_types = ["ohno::app::error::AppError"]

[[bin]]
name = "cargo-ensure-no-cyclic-deps"
path = "src/main.rs"

[dependencies]
cargo_metadata = { workspace = true }
clap = { workspace = true, features = ["derive", "std", "help", "usage", "error-context"] }
ohno = { workspace = true, features = ["app-err"] }
petgraph = { workspace = true, features = ["std", "graphmap"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
