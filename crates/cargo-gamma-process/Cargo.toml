[package]
name = "cargo-gamma-process"
description = "Internal bounded process-tree lifecycle for cargo-gamma"
version = "0.2.1"
readme = "README.md"
keywords = ["cargo", "mutation-testing", "testing"]
categories = ["development-tools::testing"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/microsoft/ox-tools/tree/main/crates/cargo-gamma-process"

[package.metadata.docs.rs]
all-features = true

[package.metadata.ox-gen-readme]
# This is an implementation detail of `cargo-gamma`; its README is an explicit stability warning.
disable = true

# Require every retained source line to be exercised across the package coverage configurations.
[package.metadata.coverage-gate]
min-lines-percent = 100.0

[features]
fault-injection = []

[dependencies]
cargo-gamma-unsafe = { workspace = true }

[dev-dependencies]
camino = { workspace = true }
tempfile = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
