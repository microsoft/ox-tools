[package]
name = "cargo-coverage-gate"
description = "A cargo subcommand that gates pull requests on per-package line coverage measured by cargo-llvm-cov"
version = "0.7.0"
readme = "README.md"
keywords = ["oxidizer", "cargo", "subcommand", "coverage", "ci"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/microsoft/ox-tools/tree/main/crates/cargo-coverage-gate"

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo_check_external_types]
# The `#[ohno::error]` attribute on `CoverageGateError` implements
# traits in `ohno` that transitively appear in the public API. Allow
# the whole `ohno` namespace rather than tracking individual items
# we are forced to re-expose.
allowed_external_types = ["ohno::*"]

# `unicode-ident` is a deliberate compatibility bound, never referenced from this crate's
# code. See the dependency comment below.
[package.metadata.cargo-udeps.ignore]
normal = ["unicode-ident"]

[package.metadata.unused-deps]
allowed = ["unicode-ident"]

# The gate filters test-only source regions and non-release Cargo targets before measuring this
# crate. The pre-0.7 floor is retained and validated by the cross-platform released-surface CI
# matrix; raise it only after that matrix improves.
[package.metadata.coverage-gate]
min-lines-percent = 99.82758

[[bin]]
name = "cargo-coverage-gate"
path = "src/bin/cargo-coverage-gate/main.rs"

[dependencies]
cargo-platform = { workspace = true }
cargo_metadata = { workspace = true }
clap = { workspace = true, features = ["derive", "std", "help", "usage", "error-context"] }
glob = { workspace = true }
lcov = { workspace = true }
mutants = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
ra_ap_syntax = { workspace = true }
semver = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
# Never named in this crate's code. It bounds the `unicode-ident` selected by
# `ra_ap_syntax` -> `ra-ap-rustc_lexer`; see the workspace dependency comment.
unicode-ident = { workspace = true }
[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
