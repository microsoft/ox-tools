[package]
name = "cargo-coverage-gate"
description = "A cargo subcommand that gates pull requests on per-package line coverage measured by cargo-llvm-cov"
version = "0.6.0"
readme = "README.md"
keywords = ["oxidizer", "cargo", "subcommand", "coverage", "ci"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/microsoft/ox-tools/tree/main/crates/cargo-coverage-gate"

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo_check_external_types]
# The `#[ohno::error]` attribute on `CoverageGateError` implements
# traits in `ohno` that transitively appear in the public API. Allow
# the whole `ohno` namespace rather than tracking individual items
# we are forced to re-expose.
allowed_external_types = ["ohno::*"]

# Production code is measured while test-only modules and scaffolding opt out with
# `#[cfg_attr(coverage_nightly, coverage(off))]`. This floor records the lowest cross-platform
# production result from the coverage-gate CI matrix; raise it only after that matrix improves.
[package.metadata.coverage-gate]
min-lines-percent = 99.82758

[[bin]]
name = "cargo-coverage-gate"
path = "src/bin/cargo-coverage-gate/main.rs"

[dependencies]
cargo-platform = { workspace = true }
cargo_metadata = { workspace = true }
clap = { workspace = true, features = ["derive", "std", "help", "usage", "error-context"] }
glob = { workspace = true }
lcov = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
semver = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[target.'cfg(windows)'.dependencies]
# Windows production paths carry mutation annotations; tests on every host annotate test-only helpers.
mutants = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
mutants = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
