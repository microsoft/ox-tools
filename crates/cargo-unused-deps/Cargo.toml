[package]
name = "cargo-unused-deps"
description = "A Cargo subcommand that finds unused and misplaced dependencies"
version = "0.2.0"
readme = "README.md"
keywords = ["oxidizer", "cargo", "subcommand", "dependencies", "ci"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/microsoft/ox-tools/tree/main/crates/cargo-unused-deps"

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo_check_external_types]
# `ohno::AppError` is the error type of the public `dispatch` entry point.
allowed_external_types = ["ohno::app::error::AppError"]

[[bin]]
name = "cargo-unused-deps"
path = "src/main.rs"

[dependencies]
cargo_metadata = { workspace = true }
clap = { workspace = true, features = ["std", "derive", "color", "help", "error-context", "usage"] }
mutants = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
toml_edit = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
