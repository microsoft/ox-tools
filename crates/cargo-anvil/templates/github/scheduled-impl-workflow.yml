name: anvil-scheduled-impl

on:
  workflow_call:
    inputs:
      linux_runner:
        description: Runner label for x86_64 Linux jobs.
        type: string
        default: ubuntu-latest
      windows_runner:
        description: Runner label for x86_64 Windows jobs.
        type: string
        default: windows-latest
      linux_arm_runner:
        description: Runner label for aarch64 Linux jobs.
        type: string
        default: ubuntu-24.04-arm
      windows_arm_runner:
        description: Runner label for aarch64 Windows jobs.
        type: string
        default: windows-11-arm
      bench_machine_key:
        description: |
          Machine key the benchmark history is partitioned by. Leave empty to
          use cargo-bench-history's hardware fingerprint. Set a stable pool
          label when the runner pool is heterogeneous enough to fragment a
          series into partitions too sparse to analyze.
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        description: |
          Codecov upload token. Optional for public repos that have OIDC
          configured at Codecov; required for private repos.
        required: false

# The caller grants the maximum token scopes available to this reusable
# workflow. Reset jobs to read-only here, then restore only the publisher's
# issues scope below. See docs/design/github.md.
permissions:
  contents: read

# Note on matrices: see pr-impl-workflow.yml for the rationale. OS
# matrices are hardcoded; per-leg runner labels are inputs.

jobs:
  scheduled-test:
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: ./.github/actions/anvil-scheduled-test
        with:
          free-disk-space: true
      - name: Upload coverage to Codecov
        # Upload from every leg except windows-11-arm (see the matching
        # comment in pr-impl-workflow.yml for the rationale).
        # Multi-flag tag combines the OS with a "scheduled" marker so
        # the Codecov UI can distinguish PR-tier uploads from scheduled
        # uploads while still tracking each platform separately.
        if: matrix.os != 'windows-arm'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/coverage/lcov-all-features.info,target/coverage/lcov-no-default.info
          flags: scheduled,${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  scheduled-advisories:
    # Cross-OS / cross-arch because clippy and udeps in this group
    # compile per host, so cfg-gated code must be linted/scanned on
    # every leg.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: ./.github/actions/anvil-scheduled-advisories

  scheduled-runtime-analysis:
    # Full-workspace counterpart of pr-runtime-analysis. OS matrix
    # mirrors pr-runtime-analysis so any OS already considered "worth
    # running miri on" gets the stricter profiles (tree-borrows,
    # strict-provenance, race-coverage) too. One job per OS leg runs
    # `just anvil-scheduled-runtime-analysis`, which executes all four
    # miri profiles (base miri + the three stricter ones) sequentially
    # within the leg. Parallelism is across OS legs, not across profiles:
    # running the profiles sequentially lets them share toolchain setup
    # and the target/ cache, which is the right trade given each profile
    # already costs hours.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: ./.github/actions/anvil-scheduled-runtime-analysis

  scheduled-exhaustive:
    # x86_64-only by design: this group includes mutants-full (which
    # doesn't build on aarch64-pc-windows-msvc — winapi crate
    # incompatibility) plus cargo-hack feature powerset and bench.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner || inputs.windows_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: ./.github/actions/anvil-scheduled-exhaustive

  scheduled-benchmarks:
    # Benchmark regression detection. x86_64-only, matching
    # scheduled-exhaustive. The history round-trip lives in the group's
    # composite action; only the job-level concerns are here.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner || inputs.windows_runner }}
    permissions:
      contents: read
      # Restoring the history reads the Actions runs/artifacts API.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The analysis orders each series by first-parent commit topology
          # and locates the merge-base, so it needs the whole commit graph.
          fetch-depth: 0
          lfs: true
      - uses: ./.github/actions/anvil-scheduled-benchmarks
        env:
          ANVIL_BENCH_MACHINE_KEY: ${{ inputs.bench_machine_key }}
          # Per-leg artifact identity: only the workflow knows the matrix
          # value, and each leg's history must stay its own series.
          ANVIL_BENCH_ARTIFACT: bench-history-${{ matrix.os }}

  publish-failure:
    name: Publish scheduled failure
    needs:
      - scheduled-test
      - scheduled-advisories
      - scheduled-runtime-analysis
      - scheduled-exhaustive
      - scheduled-benchmarks
    if: ${{ always() && vars.ANVIL_PUBLISH_FAILURE_ISSUE != 'false'
      && contains(needs.*.result, 'failure') }}
    runs-on: ${{ inputs.linux_runner }}
    permissions:
      issues: write
    steps:
      - name: Create or update failure issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ANVIL_JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const title = "[Anvil] Scheduled checks failed";
            const marker = "<!-- anvil scheduled failure -->";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const results = JSON.parse(process.env.ANVIL_JOB_RESULTS);
            const failedJobs = Object.entries(results)
              .filter(([, job]) => job.result === "failure")
              .map(([job]) => `- \`${job}\``)
              .join("\n");
            const body = [
              marker,
              "",
              "The Anvil scheduled workflow failed.",
              "",
              "Failed jobs:",
              failedJobs,
              "",
              `[View workflow run](${runUrl})`,
            ].join("\n");

            const query =
              `repo:${context.repo.owner}/${context.repo.repo} ` +
              `is:issue is:open in:body "anvil scheduled failure"`;
            const { data: search } =
              await github.rest.search.issuesAndPullRequests({
                q: query,
                per_page: 100,
              });
            const existing = search.items.find(
              issue => issue.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
