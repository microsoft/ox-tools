name: anvil-scheduled-impl

on:
  workflow_call:
    inputs:
      linux_runner:
        description: Runner label for x86_64 Linux jobs.
        type: string
        default: ubuntu-latest
      windows_runner:
        description: Runner label for x86_64 Windows jobs.
        type: string
        default: windows-latest
      linux_arm_runner:
        description: Runner label for aarch64 Linux jobs.
        type: string
        default: ubuntu-24.04-arm
      windows_arm_runner:
        description: Runner label for aarch64 Windows jobs.
        type: string
        default: windows-11-arm
      bench_machine_key:
        description: |
          Machine key the benchmark history is partitioned by. Leave empty to
          use cargo-bench-history's hardware fingerprint. Set a stable pool
          label when the runner pool is heterogeneous enough to fragment a
          series into partitions too sparse to analyze.
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        description: |
          Codecov upload token. Optional for public repos that have OIDC
          configured at Codecov; required for private repos.
        required: false

# Note on matrices: see pr-impl-workflow.yml for the rationale. OS
# matrices are hardcoded; per-leg runner labels are inputs.

jobs:
  scheduled-test:
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: ./.github/actions/anvil-scheduled-test
        with:
          free-disk-space: true
      - name: Upload coverage to Codecov
        # Upload from every leg except windows-11-arm (see the matching
        # comment in pr-impl-workflow.yml for the rationale).
        # Multi-flag tag combines the OS with a "scheduled" marker so
        # the Codecov UI can distinguish PR-tier uploads from scheduled
        # uploads while still tracking each platform separately.
        if: matrix.os != 'windows-arm'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/coverage/lcov-all-features.info,target/coverage/lcov-no-default.info
          flags: scheduled,${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  scheduled-advisories:
    # Cross-OS / cross-arch because clippy and udeps in this group
    # compile per host, so cfg-gated code must be linted/scanned on
    # every leg.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: ./.github/actions/anvil-scheduled-advisories

  scheduled-runtime-analysis:
    # Full-workspace counterpart of pr-runtime-analysis. OS matrix
    # mirrors pr-runtime-analysis so any OS already considered "worth
    # running miri on" gets the stricter profiles (tree-borrows,
    # strict-provenance, race-coverage) too. One job per OS leg runs
    # `just anvil-scheduled-runtime-analysis`, which executes all four
    # miri profiles (base miri + the three stricter ones) sequentially
    # within the leg. Parallelism is across OS legs, not across profiles:
    # running the profiles sequentially lets them share toolchain setup
    # and the target/ cache, which is the right trade given each profile
    # already costs hours.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, linux-arm, windows-arm]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner
      || matrix.os == 'windows' && inputs.windows_runner
      || matrix.os == 'linux-arm' && inputs.linux_arm_runner
      || inputs.windows_arm_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: ./.github/actions/anvil-scheduled-runtime-analysis

  scheduled-exhaustive:
    # x86_64-only by design: this group includes mutants-full (which
    # doesn't build on aarch64-pc-windows-msvc — winapi crate
    # incompatibility) plus cargo-hack feature powerset and bench.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner || inputs.windows_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: ./.github/actions/anvil-scheduled-exhaustive

  scheduled-benchmarks:
    # Benchmark regression detection. x86_64-only, matching
    # scheduled-exhaustive. The history is partitioned per machine, so
    # each leg carries its own artifact rather than sharing one name.
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    runs-on: ${{ matrix.os == 'linux' && inputs.linux_runner || inputs.windows_runner }}
    permissions:
      contents: read
      # Restoring the history reads the Actions runs/artifacts API.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The analysis orders each series by first-parent commit
          # topology and locates the merge-base, so it needs the whole
          # commit graph. LFS matters because benchmark inputs can be
          # LFS-tracked and would otherwise arrive as pointer files.
          fetch-depth: 0
          lfs: true
      - name: Restore benchmark history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: bench-history-${{ matrix.os }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # The caller's workflow *name*, not a hardcoded filename: the root
          # scheduled workflow is an owned, renameable file, and a rename
          # must not silently reset the series.
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          WINDOW: "30"
        run: |
          set -euo pipefail
          mkdir -p target/anvil/bench-history

          # Walk back from the newest run and take the first one that
          # carries this leg's artifact. Restoring from the latest
          # *successful* run would drop every sample collected while the
          # pipeline was red from a regression — precisely the window
          # that matters.
          #
          # Absence and failure are kept distinct. A run is only a
          # candidate once the artifacts API confirms the artifact exists
          # and has not expired; a download that then fails is an
          # operational error (token, API, corrupt payload) and fails the
          # job rather than being silently downgraded to a cold start.
          # That distinction is what stops one transient failure from
          # publishing an empty store over a good history.
          for run_id in $(gh run list --workflow "$WORKFLOW" \
              --branch "$DEFAULT_BRANCH" --limit "$WINDOW" \
              --json databaseId --jq '.[].databaseId'); do
            artifact_id=$(gh api --paginate \
              "repos/$REPO/actions/runs/$run_id/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT\" and .expired == false) | .id" \
              | head -n1)
            [ -n "$artifact_id" ] || continue

            if ! gh run download "$run_id" --name "$ARTIFACT" --dir target/anvil/bench-history; then
              echo "::error::found $ARTIFACT in run $run_id but could not download it;" \
                   "failing rather than continuing with an empty history, which would" \
                   "publish a truncated store over the existing chain."
              exit 1
            fi
            echo "restored benchmark history from run $run_id"
            echo "ANVIL_BENCH_RESTORE=restored" >> "$GITHUB_ENV"
            exit 0
          done

          # No run in the window carried the artifact. That is a genuine
          # cold start (first run, or the chain lapsed), so it is surfaced
          # on the summary rather than only in this log — "history quietly
          # restarted" must not look like "no regressions".
          echo "ANVIL_BENCH_RESTORE=cold-start" >> "$GITHUB_ENV"
          echo "no $ARTIFACT artifact in the last $WINDOW scheduled runs; starting a new history"
          {
            printf '### Benchmark history: cold start\n\n'
            printf 'No `%s` artifact was found in the last %s `%s` runs on `%s`, ' \
              "$ARTIFACT" "$WINDOW" "$WORKFLOW" "$DEFAULT_BRANCH"
            printf 'so this run starts a new series. Trend detection needs several runs of history.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/anvil-scheduled-benchmarks
        env:
          ANVIL_BENCH_MACHINE_KEY: ${{ inputs.bench_machine_key }}
      - name: Save benchmark history
        # always(): the run's own samples belong in the history even when
        # the analysis flagged a regression and failed the job.
        #
        # Guarded on the restore having reached a known state: if the
        # restore failed operationally the store is not a continuation of
        # the chain, and publishing it would overwrite good history with a
        # truncated snapshot.
        if: always() && env.ANVIL_BENCH_RESTORE != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-history-${{ matrix.os }}
          path: target/anvil/bench-history
          # Comfortably longer than the scheduled cadence, so a paused
          # or infrequent schedule does not break the chain.
          retention-days: 90
          if-no-files-found: ignore
      - name: Publish benchmark findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f target/anvil/bench/findings.md ]; then
            cat target/anvil/bench/findings.md >> "$GITHUB_STEP_SUMMARY"
          fi
