          let description;
          let failureLabel;
          if (setupOutcome !== "success") {
            state = "error";
            description = `setup failed before ${group} ran`;
            failureLabel = "setup";
          } else if (exitCode === "0") {
            state = "success";
            description = `all ${group} recipes passed`;
          } else if (exitCode === "") {
            state = "error";
            description = `${group} did not report a result`;
            failureLabel = "no result";
          } else {
            state = "failure";
            description = `${displayRecipe} failed`;
            failureLabel = displayRecipe;
