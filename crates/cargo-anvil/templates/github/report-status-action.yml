          const group = process.env.ANVIL_GROUP;
          const setupOutcome = process.env.ANVIL_SETUP_OUTCOME;
          const exitCode = process.env.ANVIL_EXIT_CODE;
          const failedRecipe = process.env.ANVIL_FAILED_RECIPE || `anvil-${group}`;
          const displayRecipe = failedRecipe.replace(/^anvil-/, "");
          const runner = `${process.env.RUNNER_OS}-${process.env.RUNNER_ARCH}`.toLowerCase();
          const headSha = context.payload.pull_request.head.sha;
          const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const statusPrefix = "anvil-pr / failure: ";
          const statusSuffix = ` / ${group} (${runner})`;

