              context: statusContext,
              description: statusDescription.slice(0, 140),
              target_url: targetUrl,
            });

          let currentContext;
          if (state !== "success") {
            const availableLabelLength = Math.max(
              1,
              100 - statusPrefix.length - statusSuffix.length,
