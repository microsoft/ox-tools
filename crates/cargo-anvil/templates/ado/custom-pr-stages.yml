# Repository-owned PR stage extension point. Add stages below; regeneration
# preserves edits and proposes later template changes separately. The root
# passes the Anvil pool parameters. Set `dependsOn` explicitly when a custom
# stage should not follow the preceding Anvil stage.
parameters:
  - name: linuxPool
    type: object
    default: { vmImage: ubuntu-latest }
  - name: windowsPool
    type: object
    default: { vmImage: windows-latest }

stages: []
