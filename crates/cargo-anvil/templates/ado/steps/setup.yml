#
# Parameters:
#   group: which anvil group to install setup for. Special values:
#     - "" (default): install the full catalog via
#       `just anvil-setup` -- use for "give me everything" flows.
#     - "none": skip tool installation entirely; just bootstrap the
#       rust cache + libclang + just. Used by impact.yml, which installs
#       only cargo-delta afterwards.
#     - anything else (e.g. "pr-fast"): install only that group's
#       prerequisites via `just anvil-<group>-setup`.
parameters:
  - name: group
    type: string
    default: ''
steps:
  - bash: echo "##vso[task.setvariable variable=anvil_rustc_version]$(rustc --version | awk '{print $2}')"
    displayName: anvil setup (capture rustc version)
  - task: Cache@2
    inputs:
      # Same key shape as the GitHub side: OS + arch + rustc version +
      # lockfile hashes + catalog hash. Including arch keeps any
      # future ARM pool an adopter adds from colliding with x86_64 on
      # the same OS namespace.
      key: 'anvil-v1 | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | rust$(anvil_rustc_version) | Cargo.lock | .cargo/config.toml | rust-toolchain.toml | justfiles/anvil/versions.just'
      restoreKeys: |
        anvil-v1 | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | rust$(anvil_rustc_version)
        anvil-v1 | "$(Agent.OS)" | "$(Agent.OSArchitecture)"
      path: |
        $(HOME)/.cargo/registry/cache/
        $(HOME)/.cargo/registry/index/
        $(HOME)/.cargo/bin/
        $(HOME)/.cargo/.crates.toml
        $(HOME)/.cargo/.crates2.json
        target/
    displayName: anvil setup (cache cargo home and target)

  - bash: |
      if ! command -v just >/dev/null 2>&1 ; then
        cargo install --locked just
      fi
