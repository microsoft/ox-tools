# Update cargo-anvil and regenerate; repository-specific edits stop automatic updates.
# Update behaviour: https://github.com/microsoft/ox-tools/blob/main/crates/cargo-anvil/docs/design/updates.md
#
# Parameters:
#   group: which anvil group to install setup for. Special values:
#     - "" (default): install the full catalog via
#       `just anvil-setup` -- use for "give me everything" flows.
#     - "none": skip tool installation entirely; just bootstrap the
#       rust cache + libclang + just. Used by impact.yml, which installs
#       only cargo-delta afterwards.
#     - anything else (e.g. "pr-fast"): install only that group's
#       prerequisites via `just anvil-<group>-setup`.
parameters:
  - name: group
    type: string
    default: ''
steps:
  # Restore Cargo's registry and installed binaries before bootstrapping Just,
  # so warm ADO jobs do not compile Just again before reaching the cache.
  # Rustup toolchains are not stored under Cargo home, so the selected compiler
  # version does not affect this cache's contents.
  - task: Cache@2
    inputs:
      key: 'anvil-v2 | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | Cargo.toml | Cargo.lock | .cargo/config.toml | rust-toolchain | rust-toolchain.toml | justfiles/anvil/versions.just'
      restoreKeys: |
        anvil-v2 | "$(Agent.OS)" | "$(Agent.OSArchitecture)"
      path: |
        $(HOME)/.cargo/registry/cache/
        $(HOME)/.cargo/registry/index/
        $(HOME)/.cargo/bin/
        $(HOME)/.cargo/.crates.toml
        $(HOME)/.cargo/.crates2.json
    displayName: anvil setup (cache cargo home)

  - bash: |
      if ! command -v just >/dev/null 2>&1 ; then
        cargo install --locked just
      fi
    displayName: anvil setup (install just)

  - pwsh: |
      & just anvil-toolchain-stable-install
      if ($LASTEXITCODE -ne 0) {
        throw 'anvil: failed to provision the selected stable toolchain'
      }
    displayName: anvil setup (provision stable toolchain)

  # Hand everything else off to the catalog recipe. Idempotent. ADO
  # uses the default `install` backend (source builds) because
  # cargo-binstall has unresolved compliance issues for internal ADO
  # pipelines (GH uses `binstall`).
  #
  # Selection mirrors setup-action.yml (GH composite):
  #   group=""     -> full catalog (anvil-setup)
  #   group="none" -> skip; caller installs what it needs
  #   group=<x>    -> only that group's prerequisites
  - ${{ if eq(parameters.group, 'none') }}:
      - bash: 'echo "anvil-setup: group=none, skipping tool install"'
        displayName: anvil setup (group=none -- skip tool install)
  - ${{ elseif eq(parameters.group, '') }}:
      - bash: just anvil-setup
        displayName: anvil setup (install full catalog)
  - ${{ else }}:
      - bash: just anvil-${{ parameters.group }}-setup
        displayName: anvil setup (install ${{ parameters.group }} prerequisites)
