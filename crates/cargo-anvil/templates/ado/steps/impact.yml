# GENERATED BY cargo-anvil. DO NOT EDIT DIRECTLY unless you intend to depart from anvil-provided defaults.
# Update cargo-anvil and regenerate; repository-specific edits stop automatic updates.
# Compute target/anvil/impact for publication to downstream PR groups.
steps:
  # Reuse the per-job setup (toolchain, cargo cache, just install) so
  # cargo + just are on PATH and ~/.cargo/bin is restored from cache.
  # group=none skips the full catalog install. Install only the two tools used
  # by the shared impact recipe in the next step.
  - template: setup.yml
    parameters:
      group: none
  - pwsh: |
      just anvil-tool-cargo-each-install install
      just anvil-tool-cargo-delta-install install
    displayName: anvil impact (install tools)
  - pwsh: just anvil-impact
    # Run the shared anvil-impact recipe -- the same impact building block
    # adopters run locally. It resolves the base ref (_anvil-base-ref),
    # snapshots the base ref in a throwaway worktree and the working
    # tree, runs `cargo delta impact`, and writes the cache under
    # target/anvil/impact/. This is the only job that needs cargo-delta; the
    # group stages just download the artifact it produces.
    displayName: anvil impact (cargo-delta)
