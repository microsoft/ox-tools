# GENERATED BY cargo-anvil. DO NOT EDIT DIRECTLY.
# Update cargo-anvil and regenerate; repository-specific edits stop automatic updates.
# Update behaviour: https://github.com/microsoft/ox-tools/blob/main/crates/cargo-anvil/docs/design/updates.md
#
# Restores the benchmark history published by the most recent build that
# carries this leg's artifact.
#
# `DownloadPipelineArtifact@2` with `latestFromBranch` resolves a single
# build and yields nothing if that build has no such artifact -- it does
# not walk back. A cancelled or never-publishing latest build would
# therefore cold-start a store that actually has history. This step
# resolves the build itself, so absence of the artifact throughout the
# window (a genuine cold start) stays distinct from an operational
# failure.
#
# The store path is created only once the restore has reached a known
# state -- restored, or a positively identified cold start. An operational
# failure therefore leaves *no store directory at all*, so a publisher
# that runs unconditionally has nothing to upload and the accumulated
# chain survives. That makes the guard structural rather than dependent on
# every job wrapper honouring the `artifacts` condition: a fork predating
# that field ignores it silently, and this is the case where ignoring it
# would overwrite good history with a truncated store.
#
# See https://github.com/microsoft/ox-tools/blob/main/crates/cargo-anvil/docs/design/benchmarks.md
parameters:
  - name: artifact
    type: string
  - name: path
    type: string
    default: target/anvil/bench-history
  - name: window
    type: number
    default: 30
steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $artifact = '${{ parameters.artifact }}'
      $path = '${{ parameters.path }}'
      $window = ${{ parameters.window }}

      if (-not $env:SYSTEM_ACCESSTOKEN) {
          Write-Error "anvil: SYSTEM_ACCESSTOKEN is not exposed to this job, so the benchmark history cannot be restored."
          exit 1
      }

      # Everything lands here first; $path is created only on success.
      # $PID-scoped: on a self-hosted agent two concurrent jobs share the
      # temp directory, and an artifact name is not unique across
      # overlapping pipeline runs.
      $staging = Join-Path ([System.IO.Path]::GetTempPath()) "$artifact-staging-$PID"
      Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path $staging | Out-Null

      # Publishes the staged store as the restore's result and records how
      # the restore ended, so the publish step can tell a continuation of
      # the chain from a job that never established one.
      function Complete-Restore([string]$state) {
          # Assembled beside the published path and moved into place in one
          # step. A copy that failed partway would otherwise leave a partial
          # store exactly where a wrapper forked before `artifacts[].condition`
          # existed -- which ignores that field silently -- would publish it
          # over the accumulated chain.
          $parent = Split-Path -Parent $path
          if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
          $pending = "$path.pending-$PID"
          Remove-Item -Recurse -Force $pending -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pending | Out-Null
          if (Test-Path (Join-Path $staging '*')) {
              Copy-Item -Path (Join-Path $staging '*') -Destination $pending -Recurse -Force
          }
          Remove-Item -Recurse -Force $path -ErrorAction SilentlyContinue
          Move-Item -LiteralPath $pending -Destination $path
          Write-Host "##vso[task.setvariable variable=ANVIL_BENCH_RESTORE]$state"
          # The recipe refuses to write anywhere but here, so a wrapper that
          # retargets `path` cannot silently detach the recipe's store from
          # the one that is actually published.
          Write-Host "##vso[task.setvariable variable=ANVIL_BENCH_WIRED_STORE]$path"
      }

      $collection = $env:SYSTEM_COLLECTIONURI
      $project = $env:SYSTEM_TEAMPROJECTID
      $definition = $env:SYSTEM_DEFINITIONID
      $headers = @{ Authorization = "Bearer $($env:SYSTEM_ACCESSTOKEN)" }

      # The series is keyed on the repository's default branch, matching the
      # GitHub backend and the documented contract. Keying on the branch the
      # build happened to run on would fork a fresh, one-sample history for
      # every manual or release-branch run and report that as clean.
      $definitionUri = "$collection$project/_apis/build/definitions/$definition" + "?api-version=7.0"
      $branch = (Invoke-RestMethod -Uri $definitionUri -Headers $headers).repository.defaultBranch
      if (-not $branch) {
          Write-Error "anvil: could not resolve the pipeline's default branch, so the history series cannot be identified; refusing to continue rather than fork a new chain under the current branch."
          exit 1
      }
      # Newest first, whatever the outcome: a flagged regression fails the
      # build, so restricting to successful builds would discard exactly
      # the stretch of history that matters most.
      $runsUri = "$collection$project/_apis/build/builds?definitions=$definition&branchName=$branch&`$top=$window&queryOrder=finishTimeDescending&api-version=7.0"
      $runs = (Invoke-RestMethod -Uri $runsUri -Headers $headers).value

      foreach ($run in $runs) {
          if ($run.id -eq $env:BUILD_BUILDID) { continue }

          $artifactUri = "$collection$project/_apis/build/builds/$($run.id)/artifacts?artifactName=$artifact&api-version=7.0"
          try {
              $found = Invoke-RestMethod -Uri $artifactUri -Headers $headers
          } catch {
              # 404 is "this build has no such artifact" -- the expected,
              # common case while walking back. Anything else is an
              # operational failure and must not be read as absence.
              $status = $_.Exception.Response.StatusCode.value__
              if ($status -eq 404) { continue }
              Write-Error "anvil: querying artifacts of build $($run.id) failed with HTTP $status; refusing to continue with an empty history."
              exit 1
          }
          if (-not $found.resource.downloadUrl) { continue }

          Write-Host "anvil: restoring $artifact from build $($run.id)"
          $zip = Join-Path ([System.IO.Path]::GetTempPath()) "$artifact-$PID.zip"
          $extract = Join-Path ([System.IO.Path]::GetTempPath()) "$artifact-extract-$PID"
          Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri $found.resource.downloadUrl -Headers $headers -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          # The archive nests its contents under a directory named for the
          # artifact; lift them up into the staging directory. An artifact
          # that is present but empty is a valid restore -- a workspace with
          # no benchmarks yet publishes exactly that -- and `Copy-Item` over
          # an empty wildcard throws, so the copy is guarded.
          $inner = Join-Path $extract $artifact
          $source = if (Test-Path $inner) { $inner } else { $extract }
          if (Test-Path (Join-Path $source '*')) {
              Copy-Item -Path (Join-Path $source '*') -Destination $staging -Recurse -Force
          }
          Complete-Restore 'restored'
          exit 0
      }

      # Nothing in the window carried the artifact: a genuine cold start,
      # which is a valid empty store rather than a failure.
      Write-Host "anvil: no $artifact artifact in the last $window builds on $branch; starting a new history"
      Complete-Restore 'cold-start'
    displayName: Restore ${{ parameters.artifact }}
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
