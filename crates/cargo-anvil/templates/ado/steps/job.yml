#
# Default job wrapper emitted by cargo-anvil.
#
# Owns the per-job *shape*: how `pool`, `steps`, and `artifacts` map onto the
# concrete `job:` block. Pipelines that use extension templates (1ES PT,
# SubstratePT, M365PT, etc.) take ownership of THIS file once and add their
# required `templateContext:` block -- the owned stages templates
# (pr-stages.yml / scheduled-stages.yml) then continue to update normally
# because they address this wrapper only through its parameter contract.
#
# That promise covers the wrapper's *body*, which may diverge arbitrarily. It
# does not cover a contract that GROWS: ADO rejects a parameter the target
# template does not declare, so a stages update that starts passing a new
# parameter has to be taken together with the matching wrapper update, which
# anvil offers as a `.proposed` sibling. `stage` below is the first such growth.
#
# Once you edit this file, cargo-anvil treats it as user-owned: subsequent
# updates Propose into a `.proposed` sibling rather than overwriting.
#
# Contract (intentionally small and stable):
#   - name      (string)   Job name; ADO derives the display name from it.
#   - stage     (string)   ADO stage this job belongs to, e.g. `pr_mutants`.
#                          Exists so an owned wrapper can discriminate between
#                          stages; the default wrapper ignores it. Per-OS job
#                          names repeat (`linux` / `windows` in every pr-* and
#                          scheduled-* stage, `compute_linux` /
#                          `compute_windows` in impact), so `name` alone does
#                          not identify the stage -- and `templateContext:` is
#                          consumed at template-expansion time, so a runtime
#                          condition on `System.StageName` is not available
#                          there either. The value is exactly what the stages
#                          template writes after `stage:`, one of:
#                            impact
#                            pr_fast   pr_test   pr_msrv
#                            pr_runtime_analysis   pr_mutants
#                            scheduled_test   scheduled_advisories
#                            scheduled_runtime_analysis   scheduled_exhaustive
#                          Unrelated to `group` in steps/setup.yml, which
#                          selects a check group's tool catalog.
#                          Defaults to '' so a caller that passes no stage
#                          still renders.
#   - pool      (object)   Pool block, passed verbatim to ADO's `pool:` key.
#   - steps     (stepList) Body of the job. Templated step lists are fine.
#   - inputArtifacts (object) Optional list of pipeline artifacts to download
#                          BEFORE the steps run. Each item: { name, path }.
#                          The default wrapper prepends one
#                          DownloadPipelineArtifact@2 task per entry; 1ESPT
#                          wrappers translate these into their own download
#                          mechanism (e.g. templateContext.inputs). The impact
#                          set is shared this way -- a group job downloads the
#                          `anvil-impact-<os>` artifact into target/anvil/impact
#                          and its checks read the cache exactly as a local run.
#   - artifacts (object)   Optional list of pipeline artifacts to publish.
#                          Each item: { name: string, path: string }.
#                          The default wrapper appends one
#                          PublishPipelineArtifact@1 task per entry; 1ESPT
#                          wrappers translate these into
#                          templateContext.outputs.pipelineArtifact blocks
#                          at job level. The contract is the same either way,
#                          so the stages templates don't need to know which
#                          backend they're targeting.
parameters:
  - name: name
    type: string
  - name: stage
    type: string
    default: ''
  - name: pool
    type: object
  - name: steps
    type: stepList
  - name: inputArtifacts
    type: object
    default: []
  - name: artifacts
    type: object
    default: []

jobs:
  - job: ${{ parameters.name }}
    pool: ${{ parameters.pool }}
    steps:
      - ${{ each artifact in parameters.inputArtifacts }}:
          # DownloadPipelineArtifact@2 is the current major of the built-in
          # download task; v2 takes the `artifact` + `path` inputs used here
          # (v1 used the older `artifactName`/`downloadPath` contract). Pinning
          # the major keeps this default wrapper on that stable input shape --
          # 1ESPT-compliant pipelines that cannot use this task override
          # `inputArtifacts` and translate it into their own download mechanism.
          - task: DownloadPipelineArtifact@2
            displayName: Download ${{ artifact.name }}
            inputs:
              artifact: ${{ artifact.name }}
              path: ${{ artifact.path }}
      - ${{ each step in parameters.steps }}:
          - ${{ step }}
      - ${{ each artifact in parameters.artifacts }}:
          - task: PublishPipelineArtifact@1
            displayName: Publish ${{ artifact.name }}
            condition: succeededOrFailed()
            inputs:
              targetPath: ${{ artifact.path }}
              artifact: ${{ artifact.name }}
