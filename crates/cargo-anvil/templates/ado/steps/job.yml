#
# Default job wrapper emitted by cargo-anvil. Repositories using compliance
# templates may edit this owned file to add `templateContext`; later catalog
# changes are proposed separately instead of overwriting it.
#
# Parameters form the contract with generated stage templates:
# - `name`, `stage`, and `pool` identify and place the job.
# - `steps` is the job body.
# - `inputArtifacts` downloads `{ name, path }` entries before the body.
# - `artifacts` publishes `{ name, path }` entries after the body.
# A stages update that passes a new parameter requires adopting the matching
# proposed wrapper update because ADO rejects undeclared parameters.
parameters:
  - name: name
    type: string
  - name: stage
    type: string
    default: ''
  - name: pool
    type: object
  - name: steps
    type: stepList
  - name: inputArtifacts
    type: object
    default: []
  - name: artifacts
    type: object
    default: []

jobs:
  - job: ${{ parameters.name }}
    pool: ${{ parameters.pool }}
    steps:
      - ${{ each artifact in parameters.inputArtifacts }}:
          # Compliance wrappers can translate this contract to their own
          # artifact-download mechanism.
          - task: DownloadPipelineArtifact@2
            displayName: Download ${{ artifact.name }}
            inputs:
              artifact: ${{ artifact.name }}
              path: ${{ artifact.path }}
      - template: ../hooks/before-checks.yml
      - ${{ each step in parameters.steps }}:
          - ${{ step }}
      - template: ../hooks/after-checks.yml
      - ${{ each artifact in parameters.artifacts }}:
          - task: PublishPipelineArtifact@1
            displayName: Publish ${{ artifact.name }}
            condition: succeededOrFailed()
            inputs:
              targetPath: ${{ artifact.path }}
              artifact: ${{ artifact.name }}
