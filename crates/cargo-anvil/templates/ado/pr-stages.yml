# GENERATED BY cargo-anvil. DO NOT EDIT DIRECTLY unless you intend to depart from anvil-provided defaults.
# Update cargo-anvil and regenerate; repository-specific edits stop automatic updates.
# Every job uses the repository-customizable `steps/job.yml` wrapper. Template
# paths below are relative to this stages file.
parameters:
  - name: linuxPool
    type: object
    default: { vmImage: ubuntu-latest }
  - name: windowsPool
    type: object
    default: { vmImage: windows-latest }

stages:
  # Compute impact per OS because target-specific dependencies change Cargo's
  # reverse-dependency graph. Downstream jobs consume the matching artifact.
  - stage: impact
    displayName: anvil impact
    jobs:
      - template: steps/job.yml
        parameters:
          name: compute_linux
          stage: impact
          pool: ${{ parameters.linuxPool }}
          steps:
            - template: steps/impact.yml
          artifacts:
            - name: anvil-impact-linux
              path: target/anvil/impact
      - template: steps/job.yml
        parameters:
          name: compute_windows
          stage: impact
          pool: ${{ parameters.windowsPool }}
          steps:
            - template: steps/impact.yml
          artifacts:
            - name: anvil-impact-windows
              path: target/anvil/impact

  # PR stages use ADO's default success gate: failed impact blocks checks.
  # Each job downloads its OS-specific cache into target/anvil/impact/.
  - stage: pr_fast
    displayName: anvil pr-fast
    dependsOn: [impact]
    jobs:
      # Cross-OS because pr-fast contains compile-sensitive checks
      # (clippy, doc-build, udeps, external-types) whose
      # results can differ across host OS for crates that use
      # #[cfg(target_os = ...)] gating.
      - template: steps/job.yml
        parameters:
          name: linux
          stage: pr_fast
          pool: ${{ parameters.linuxPool }}
          inputArtifacts:
            - name: anvil-impact-linux
              path: target/anvil/impact
          steps:
            - template: steps/pr-fast.yml
      - template: steps/job.yml
        parameters:
          name: windows
          stage: pr_fast
          pool: ${{ parameters.windowsPool }}
          inputArtifacts:
            - name: anvil-impact-windows
              path: target/anvil/impact
          steps:
            - template: steps/pr-fast.yml

  # Slow groups are independent stages after impact. ADO uses Linux and Windows
  # x86_64; fuzzing is Linux-only.

  - stage: pr_test
    displayName: anvil pr-test (tests + coverage)
    dependsOn: [impact]
    jobs:
      # Publish the same filtered LCOV files gated by cargo-coverage-gate.
      # Both OS jobs contribute their native cfg-gated coverage.
      - template: steps/job.yml
        parameters:
          name: linux
          stage: pr_test
          pool: ${{ parameters.linuxPool }}
          inputArtifacts:
            - name: anvil-impact-linux
              path: target/anvil/impact
          steps:
            - template: steps/pr-test.yml
            - task: PublishCodeCoverageResults@2
              condition: succeededOrFailed()
              displayName: Publish coverage (linux)
              inputs:
                summaryFileLocation: target/coverage/lcov-*.info
                failIfCoverageEmpty: false
      - template: steps/job.yml
        parameters:
          name: windows
          stage: pr_test
          pool: ${{ parameters.windowsPool }}
          inputArtifacts:
            - name: anvil-impact-windows
              path: target/anvil/impact
          steps:
            - template: steps/pr-test.yml
            - task: PublishCodeCoverageResults@2
              condition: succeededOrFailed()
              displayName: Publish coverage (windows)
              inputs:
                summaryFileLocation: target/coverage/lcov-*.info
                failIfCoverageEmpty: false

  - stage: pr_msrv
    displayName: anvil pr-msrv (MSRV tests)
    dependsOn: [impact]
    jobs:
      - template: steps/job.yml
        parameters:
          name: linux
          stage: pr_msrv
          pool: ${{ parameters.linuxPool }}
          inputArtifacts:
            - name: anvil-impact-linux
              path: target/anvil/impact
          steps:
            - template: steps/pr-msrv.yml
      - template: steps/job.yml
        parameters:
          name: windows
          stage: pr_msrv
          pool: ${{ parameters.windowsPool }}
          inputArtifacts:
            - name: anvil-impact-windows
              path: target/anvil/impact
          steps:
            - template: steps/pr-msrv.yml

  - stage: pr_runtime_analysis
    displayName: anvil pr-runtime-analysis (miri + careful + loom)
    dependsOn: [impact]
    jobs:
      - ${{ each check in split('miri,careful,loom', ',') }}:
          - template: steps/job.yml
            parameters:
              name: linux_${{ check }}
              stage: pr_runtime_analysis
              pool: ${{ parameters.linuxPool }}
              inputArtifacts:
                - name: anvil-impact-linux
                  path: target/anvil/impact
              steps:
                - template: steps/${{ check }}.yml
          - template: steps/job.yml
            parameters:
              name: windows_${{ check }}
              stage: pr_runtime_analysis
              pool: ${{ parameters.windowsPool }}
              inputArtifacts:
                - name: anvil-impact-windows
                  path: target/anvil/impact
              steps:
                - template: steps/${{ check }}.yml

  - stage: pr_fuzzing
    displayName: anvil pr-fuzzing (bolero)
    dependsOn: [impact]
    jobs:
      - template: steps/job.yml
        parameters:
          name: linux
          stage: pr_fuzzing
          pool: ${{ parameters.linuxPool }}
          inputArtifacts:
            - name: anvil-impact-linux
              path: target/anvil/impact
          steps:
            - template: steps/pr-fuzzing.yml

  - stage: pr_mutants
    displayName: anvil pr-mutants (cargo-gamma)
    dependsOn: [impact]
    jobs:
      - template: steps/job.yml
        parameters:
          name: linux
          stage: pr_mutants
          pool: ${{ parameters.linuxPool }}
          inputArtifacts:
            - name: anvil-impact-linux
              path: target/anvil/impact
          steps:
            - template: steps/pr-mutants.yml
      - template: steps/job.yml
        parameters:
          name: windows
          stage: pr_mutants
          pool: ${{ parameters.windowsPool }}
          inputArtifacts:
            - name: anvil-impact-windows
              path: target/anvil/impact
          steps:
            - template: steps/pr-mutants.yml
