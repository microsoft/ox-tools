# see pr-stages.yml for the rationale and template-path note.
parameters:
  - name: linuxPool
    type: object
    default: { vmImage: ubuntu-latest }
  - name: windowsPool
    type: object
    default: { vmImage: windows-latest }
  - name: benchMachineKey
    type: string
    # Machine key the benchmark history is partitioned by. Empty uses
    # cargo-bench-history's hardware fingerprint; set a stable pool label
    # when the agent pool is heterogeneous enough to fragment a series into
    # partitions too sparse to analyze.
    default: ''

stages:
  - stage: scheduled_test
    displayName: anvil scheduled-test
    jobs:
      # Publish coverage from both legs so OS-gated code is fully
      # represented (see the pr-stages.yml comment for the rationale).
      - template: steps/job.yml
        parameters:
          name: linux
          pool: ${{ parameters.linuxPool }}
          steps:
            - template: steps/scheduled-test.yml
            - task: PublishCodeCoverageResults@2
              condition: succeededOrFailed()
              displayName: Publish coverage (linux)
              inputs:
                summaryFileLocation: target/coverage/cobertura-*.xml
                failIfCoverageEmpty: false
      - template: steps/job.yml
        parameters:
          name: windows
          pool: ${{ parameters.windowsPool }}
          steps:
            - template: steps/scheduled-test.yml
            - task: PublishCodeCoverageResults@2
              condition: succeededOrFailed()
              displayName: Publish coverage (windows)
              inputs:
                summaryFileLocation: target/coverage/cobertura-*.xml
                failIfCoverageEmpty: false

  - stage: scheduled_advisories
    displayName: anvil scheduled-advisories
    dependsOn: []
    jobs:
      # Cross-OS because clippy and udeps in this group compile per host,
      # so cfg-gated code must be linted/scanned on both OSes.
      - template: steps/job.yml
        parameters:
          name: linux
          pool: ${{ parameters.linuxPool }}
          steps:
            - template: steps/scheduled-advisories.yml
      - template: steps/job.yml
        parameters:
          name: windows
          pool: ${{ parameters.windowsPool }}
          steps:
            - template: steps/scheduled-advisories.yml

  - stage: scheduled_runtime_analysis
    displayName: anvil scheduled-runtime-analysis
    dependsOn: []
    jobs:
      # OS scope mirrors pr-runtime-analysis: any OS already considered
      # "worth running miri on" gets the stricter profiles too. ADO
      # hosted pools don't ship hosted ARM runners; adopters with self-
      # hosted ARM agents override the matrix in their root pipeline.
      - template: steps/job.yml
        parameters:
          name: linux
          pool: ${{ parameters.linuxPool }}
          steps:
            - template: steps/scheduled-runtime-analysis.yml
      - template: steps/job.yml
        parameters:
          name: windows
          pool: ${{ parameters.windowsPool }}
          steps:
            - template: steps/scheduled-runtime-analysis.yml

  - stage: scheduled_exhaustive
    displayName: anvil scheduled-exhaustive
    dependsOn: []
    jobs:
      # Cross-OS to match oxidizer's policy: full-workspace mutation
      # testing + cargo-hack powerset + bench compile checks all benefit
      # from running on both OSes for cfg(target_os) coverage. Adopters
      # who can't afford the Windows leg override the matrix in their
      # root pipeline.
      - template: steps/job.yml
        parameters:
          name: linux
          pool: ${{ parameters.linuxPool }}
          steps:
            - template: steps/scheduled-exhaustive.yml
      - template: steps/job.yml
        parameters:
          name: windows
          pool: ${{ parameters.windowsPool }}
          steps:
            - template: steps/scheduled-exhaustive.yml

  - stage: scheduled_benchmarks
    displayName: anvil scheduled-benchmarks
    dependsOn: []
    variables:
      # Read by the bench-history recipe; empty means "use the hardware
      # fingerprint". ADO exports pipeline variables as environment
      # variables, so this reaches the recipe without further plumbing.
      ANVIL_BENCH_MACHINE_KEY: ${{ parameters.benchMachineKey }}
    jobs:
      # Benchmark regression detection. OS scope matches
      # scheduled-exhaustive. The history is partitioned per machine, so
      # each leg carries its own artifact rather than sharing one name.
      #
      # The publish goes through the wrapper's `artifacts` contract like
      # every other job, carrying a `condition`: the store is only a valid
      # continuation of the chain once the restore reached a known state,
      # so an operational restore failure must not overwrite good history
      # with a truncated snapshot. Failed runs still publish -- a flagged
      # regression fails the job, and those samples belong in the history.
      #
      # The explicit `checkout` leads the step list rather than going
      # through a wrapper parameter: `steps/job.yml` is the file adopters
      # fork for 1ESPT and friends, so binding a parameter their wrapper
      # does not declare would fail template expansion for the whole
      # pipeline. An explicit checkout step needs nothing from the wrapper
      # and replaces the implicit default checkout.
      - template: steps/job.yml
        parameters:
          name: linux
          pool: ${{ parameters.linuxPool }}
          artifacts:
            - name: bench-history-linux
              path: target/anvil/bench-history
              condition: and(succeededOrFailed(), ne(variables['ANVIL_BENCH_RESTORE'], ''))
          steps:
            # The analysis orders each series by first-parent commit
            # topology and locates the merge-base, so it needs the whole
            # commit graph. LFS matters because benchmark inputs can be
            # LFS-tracked and would otherwise arrive as pointer files.
            - checkout: self
              fetchDepth: 0
              lfs: true
            - template: steps/bench-history-restore.yml
              parameters:
                artifact: bench-history-linux
            - template: steps/scheduled-benchmarks.yml
            - template: steps/bench-history-summary.yml
      - template: steps/job.yml
        parameters:
          name: windows
          pool: ${{ parameters.windowsPool }}
          artifacts:
            - name: bench-history-windows
              path: target/anvil/bench-history
              condition: and(succeededOrFailed(), ne(variables['ANVIL_BENCH_RESTORE'], ''))
          steps:
            - checkout: self
              fetchDepth: 0
              lfs: true
            - template: steps/bench-history-restore.yml
              parameters:
                artifact: bench-history-windows
            - template: steps/scheduled-benchmarks.yml
            - template: steps/bench-history-summary.yml
