[package]
name = "cargo-gamma"
description = "Fast mutation testing for Rust"
version = "0.8.0"
readme = "README.md"
keywords = ["cargo", "cargo-plugin", "mutation-testing", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/microsoft/ox-tools/tree/main/crates/cargo-gamma"
exclude = ["docs/TODO.md"]

[package.metadata.docs.rs]
all-features = true

# cargo-udeps does not detect dependencies used only by doctests.
[package.metadata.cargo-udeps.ignore]
development = ["cargo-gamma-attrs"]

# The cross-platform coverage matrix measures five of six production lines;
# the uncovered line is the native terminal-detection fallback.
[package.metadata.coverage-gate]
min-lines-percent = 83.3

[features]
system-tests = ["cargo-gamma-lib/system-tests"]

[dependencies]
cargo-gamma-lib = { workspace = true }
terminal_size = { workspace = true }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
rallocator = { workspace = true }

[dev-dependencies]
cargo-gamma-attrs = { workspace = true }
cargo-gamma-lib = { workspace = true, features = ["internals"] }
clap = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
