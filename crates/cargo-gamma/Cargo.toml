[package]
name = "cargo-gamma"
description = "Fast mutation testing for Rust"
version = "0.2.1"
readme = "README.md"
keywords = ["cargo", "cargo-plugin", "mutation-testing", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/microsoft/ox-tools/tree/main/crates/cargo-gamma"
exclude = ["docs/TODO.md"]

[package.metadata.docs.rs]
all-features = true

# The terminal adapter and entry point already exclude themselves from coverage.
# Excluding test code leaves no coverage records for this crate.
# Anvil runs tests through plain nextest for explicit package selections;
# unscoped workspace runs still use llvm-cov nextest with test code excluded.
[package.metadata.coverage-gate]
min-lines-percent = 0.0

[dependencies]
cargo-gamma-lib = { workspace = true }
rallocator = { workspace = true }
terminal_size = { workspace = true }

[dev-dependencies]
cargo-gamma-lib = { workspace = true, features = ["internals"] }
clap = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
