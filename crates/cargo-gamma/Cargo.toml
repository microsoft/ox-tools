[package]
name = "cargo-gamma"
description = "Fast mutation testing for Rust"
version = "0.2.1"
readme = "README.md"
keywords = ["cargo", "cargo-plugin", "mutation-testing", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]

edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/microsoft/ox-tools/tree/main/crates/cargo-gamma"

[package.metadata.docs.rs]
all-features = true

[dependencies]
cargo-gamma-lib = { workspace = true }
mimalloc = { workspace = true }
terminal_size = { workspace = true }

[dev-dependencies]
cargo-gamma-lib = { workspace = true, features = ["internals"] }
clap = { workspace = true }

# >>> anvil-managed: anvil-lints
[lints]
workspace = true
# <<< anvil-managed: anvil-lints
